<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patients — DentalCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/reset.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/layout.css">
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<template id="tpl-page">
  <div class="page-header">
    <div>
      <h1 class="page-header__title" data-i18n="patients.title">Patients</h1>
      <p class="page-header__desc" data-i18n="patients.desc">Manage patient records and history</p>
    </div>
    <div class="page-header__actions">
      <button class="btn btn-primary" data-modal-open="newPatientModal"><span class="icon-plus"></span><span data-i18n="patients.new_patient">New Patient</span></button>
    </div>
  </div>

  <div class="card">
    <div class="flex items-center justify-between gap-3 flex-wrap mb-4">
      <div class="search-bar" style="max-width:320px;">
        <span class="icon-search"></span>
        <input type="text" id="searchInput" data-i18n-placeholder="common.search" placeholder="Search">
      </div>
      <div class="dropdown">
        <button class="dropdown-toggle" data-dropdown-toggle><span class="icon-filter"></span><span id="statusFilterLabel" data-i18n="common.status">Status</span><span class="icon-chevron"></span></button>
        <div class="dropdown-menu" id="statusFilterMenu"></div>
      </div>
    </div>

    <div class="table-wrap" id="tableWrap">
      <table class="data-table to-cards">
        <thead>
          <tr>
            <th data-i18n="common.name">Name</th>
            <th data-i18n="common.status">Status</th>
            <th data-i18n="patients.last_visit">Last Visit</th>
            <th>Upcoming</th>
            <th data-i18n="common.balance">Balance</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div id="emptyState" class="hidden"></div>

    <div class="flex items-center justify-between mt-4" style="margin-top: var(--space-4);">
      <span class="text-sm text-muted" id="resultsCount"></span>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</template>

<div class="modal-backdrop" id="newPatientModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" data-i18n="patients.new_patient">New Patient</div>
      <button class="btn-icon btn-sm" data-modal-close><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label class="form-label" data-i18n="common.name">Name</label><input type="text" class="form-control" placeholder="Full name"></div>
        <div class="form-group"><label class="form-label" data-i18n="common.age">Age</label><input type="number" class="form-control" placeholder="Age"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label" data-i18n="common.phone">Phone</label><input type="tel" class="form-control" placeholder="+1 555-0100"></div>
        <div class="form-group"><label class="form-label" data-i18n="common.gender">Gender</label>
          <select class="form-control"><option data-i18n="common.male">Male</option><option data-i18n="common.female">Female</option></select>
        </div>
      </div>
      <div class="form-group"><label class="form-label" data-i18n="common.email">Email</label><input type="email" class="form-control" placeholder="patient@email.com"></div>
      <div class="form-group"><label class="form-label" data-i18n="patients.medical_history">Medical History</label><textarea class="form-control" placeholder="Notes, allergies, prior conditions..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-modal-close data-i18n="common.cancel">Cancel</button>
      <button class="btn btn-primary" id="savePatientBtn" data-i18n="common.save">Save</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="../../js/firebase-init.js"></script>
<script src="../../js/translations.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/theme.js"></script>
<script src="../../js/icons.js"></script>
<script src="../../js/firestore-api.js"></script>
<script src="../../js/tenant.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/components.js"></script>
<script src="../../js/app-shell.js"></script>
<script>
  THEME.init();
  I18N.init(TRANSLATIONS);
  AppShell.init({ active: 'patients' });
  auth.onAuthStateChanged((user) => {
    if (!user) { window.location.href = '../public/login.html'; }
  });
  const clinicId = TENANT.getCurrentClinicId();

  const content = document.getElementById('pageContent');
  content.innerHTML = document.getElementById('tpl-page').innerHTML;
  I18N.applyToDOM(content);
  document.querySelector('.icon-plus').innerHTML = ICONS.plus;
  document.querySelector('.icon-search').innerHTML = ICONS.search;
  document.querySelector('.icon-filter').innerHTML = ICONS.filter;
  document.querySelector('.icon-chevron').innerHTML = ICONS.chevronDown;

  let allPatients = [];
  let currentPage = 1;
  const pageSize = 8;
  let statusFilter = 'all';
  let searchTerm = '';

  function buildStatusMenu() {
    document.getElementById('statusFilterMenu').innerHTML = ['all', 'active', 'inactive'].map(s => `
      <button class="dropdown-item" data-status="${s}">${s === 'all' ? I18N.t('common.all') : I18N.t('status.' + s)}</button>
    `).join('');
  }

  function applyFilters() {
    return allPatients.filter(p => {
      if (statusFilter !== 'all' && p.status !== statusFilter) return false;
      if (searchTerm && !p.name.toLowerCase().includes(searchTerm.toLowerCase())) return false;
      return true;
    });
  }

  function render() {
    const filtered = applyFilters();
    const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
    currentPage = Math.min(currentPage, totalPages);
    const pageItems = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);

    const tableWrap = document.getElementById('tableWrap');
    const emptyState = document.getElementById('emptyState');

    if (filtered.length === 0) {
      tableWrap.classList.add('hidden');
      emptyState.classList.remove('hidden');
      emptyState.innerHTML = `
        <div class="empty-state">
          <div class="empty-state__icon">${icon('patients')}</div>
          <div class="empty-state__title">${I18N.t('patients.empty_title')}</div>
          <div class="empty-state__desc">${I18N.t('patients.empty_desc')}</div>
        </div>`;
    } else {
      tableWrap.classList.remove('hidden');
      emptyState.classList.add('hidden');
      document.getElementById('tableBody').innerHTML = pageItems.map(p => `
        <tr>
          <td data-label="${I18N.t('common.name')}">
            <div class="flex items-center gap-3">
              <div class="avatar avatar-sm" style="background:#${p.avatarColor}22; color:#${p.avatarColor};">${p.name.split(' ').map(n=>n[0]).join('').slice(0,2)}</div>
              <div>
                <div class="fw-medium">${p.name}</div>
                <div class="text-xs text-muted">${p.id}</div>
              </div>
            </div>
          </td>
          <td data-label="${I18N.t('common.status')}"><span class="badge badge-${p.status === 'active' ? 'success' : 'neutral'}">${I18N.t('status.' + p.status)}</span></td>
          <td data-label="${I18N.t('patients.last_visit')}" class="cell-muted">${p.lastVisit}</td>
          <td data-label="Upcoming" class="cell-muted">${p.upcoming || '—'}</td>
          <td data-label="${I18N.t('common.balance')}" class="fw-semibold" style="color:${p.balance > 0 ? 'var(--color-danger)' : 'var(--color-success)'};">$${p.balance}</td>
          <td class="cell-actions">
            <a href="patient-detail.html?id=${p.id}" class="btn btn-secondary btn-sm" data-i18n="common.view">View</a>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('resultsCount').textContent = `${filtered.length} results`;
    const pag = document.getElementById('pagination');
    let pagHtml = `<button ${currentPage === 1 ? 'disabled' : ''} data-page="prev">${ICONS.chevronLeft}</button>`;
    for (let i = 1; i <= totalPages; i++) {
      pagHtml += `<button class="${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
    }
    pagHtml += `<button ${currentPage === totalPages ? 'disabled' : ''} data-page="next">${ICONS.chevronRight}</button>`;
    pag.innerHTML = pagHtml;
  }

  document.getElementById('pagination').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-page]');
    if (!btn) return;
    const val = btn.getAttribute('data-page');
    if (val === 'prev') currentPage--;
    else if (val === 'next') currentPage++;
    else currentPage = parseInt(val, 10);
    render();
  });

  document.getElementById('statusFilterMenu').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-status]');
    if (!btn) return;
    statusFilter = btn.getAttribute('data-status');
    document.getElementById('statusFilterLabel').textContent = statusFilter === 'all' ? I18N.t('common.status') : I18N.t('status.' + statusFilter);
    currentPage = 1;
    render();
  });

  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    currentPage = 1;
    render();
  });

  document.getElementById('savePatientBtn').addEventListener('click', () => {
    Modal.close('newPatientModal');
    Toast.success(I18N.t('toast.saved_title'), I18N.t('toast.saved_desc'));
  });

  MOCK_API.getPatients(clinicId).then(data => {
    allPatients = data;
    buildStatusMenu();
    render();
  });

  document.addEventListener('i18n:changed', () => { buildStatusMenu(); render(); });
</script>
</body>
</html>
