<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notification Center — DentalCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/reset.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/layout.css">
<style>
  .channel-icon { width: 38px; height: 38px; border-radius: var(--radius-md); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .channel-icon svg { width: 18px; height: 18px; }
  .channel-icon.whatsapp { background: #25D3661a; color: #25D366; }
  .channel-icon.sms { background: var(--color-primary-light); color: var(--color-primary); }
  .channel-icon.email { background: var(--color-secondary-light); color: var(--color-secondary); }

  .msg-row { display:flex; align-items:center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); cursor: pointer; transition: background var(--duration-fast) var(--ease-out); }
  .msg-row:hover { background: var(--color-surface-alt); }
  .msg-row__body { flex: 1; min-width: 0; }
  .msg-row__title { font-weight: var(--fw-semibold); font-size: var(--fs-sm); }
  .msg-row__meta { font-size: var(--fs-xs); color: var(--color-text-muted); margin-top: 2px; }

  .content-preview {
    background: var(--color-surface-alt); border-radius: var(--radius-md); padding: var(--space-4);
    font-size: var(--fs-sm); line-height: var(--lh-relaxed); border: 1px solid var(--color-border);
  }
</style>
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<template id="tpl-page">
  <div class="page-header">
    <div>
      <h1 class="page-header__title" data-i18n="notifications_page.title">Notification Center</h1>
      <p class="page-header__desc" data-i18n="notifications_page.desc">Track WhatsApp, SMS, and Email messages sent to patients</p>
    </div>
    <div class="page-header__actions">
      <button class="btn btn-secondary" id="markAllReadBtn" data-i18n="notifications_page.mark_all_read">Mark all as read</button>
    </div>
  </div>

  <div class="grid-stats" id="statsGrid" style="margin-bottom: var(--space-5);"></div>

  <div class="grid-2">
    <div class="card">
      <div class="tabs mb-4">
        <button class="tab active" data-channel="all" data-i18n="notifications_page.all_channels">All Channels</button>
        <button class="tab" data-channel="whatsapp" data-i18n="notifications_page.channel_whatsapp">WhatsApp</button>
        <button class="tab" data-channel="sms" data-i18n="notifications_page.channel_sms">SMS</button>
        <button class="tab" data-channel="email" data-i18n="notifications_page.channel_email">Email</button>
      </div>
      <div class="flex items-center gap-2 flex-wrap mb-4">
        <div class="dropdown">
          <button class="dropdown-toggle" data-dropdown-toggle><span class="icon-filter"></span><span id="stateFilterLabel" data-i18n="notifications_page.state">State</span><span class="icon-chevron"></span></button>
          <div class="dropdown-menu" id="stateFilterMenu"></div>
        </div>
        <div class="dropdown">
          <button class="dropdown-toggle" data-dropdown-toggle><span class="icon-filter2"></span><span id="kindFilterLabel" data-i18n="notifications_page.type">Type</span><span class="icon-chevron2"></span></button>
          <div class="dropdown-menu" id="kindFilterMenu"></div>
        </div>
      </div>
      <div class="flex flex-col gap-1" id="msgList"></div>
      <div id="emptyState" class="hidden"></div>
    </div>

    <div class="card">
      <div class="card-header"><div class="card-title" data-i18n="dashboard.notifications">In-App Notifications</div></div>
      <div class="flex flex-col gap-1" id="notifList"></div>
    </div>
  </div>
</template>

<!-- Message detail modal -->
<div class="modal-backdrop" id="msgDetailModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" data-i18n="notifications_page.message_details">Message Details</div>
      <button class="btn-icon btn-sm" data-modal-close><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="flex items-center gap-3 mb-4" id="msgDetailHeader"></div>
      <div class="flex flex-col gap-2 mb-4" id="msgDetailMeta"></div>
      <label class="form-label" style="display:block; margin-bottom: var(--space-2);" data-i18n="notifications_page.message_content">Message Content</label>
      <div class="content-preview" id="msgDetailContent"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-modal-close data-i18n="common.close">Close</button>
      <button class="btn btn-primary" id="resendMsgBtn" data-i18n="notifications_page.resend">Resend</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="../../js/firebase-init.js"></script>
<script src="../../js/translations.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/theme.js"></script>
<script src="../../js/icons.js"></script>
<script src="../../js/firestore-api.js"></script>
<script src="../../js/tenant.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/components.js"></script>
<script src="../../js/app-shell.js"></script>
<script>
  THEME.init();
  I18N.init(TRANSLATIONS);
  AppShell.init({ active: 'notifications' });
  auth.onAuthStateChanged((user) => {
    if (!user) { window.location.href = '../public/login.html'; }
  });
  const clinicId = TENANT.getCurrentClinicId();

  const content = document.getElementById('pageContent');
  content.innerHTML = document.getElementById('tpl-page').innerHTML;
  I18N.applyToDOM(content);
  document.querySelector('.icon-filter').innerHTML = ICONS.filter;
  document.querySelector('.icon-chevron').innerHTML = ICONS.chevronDown;
  document.querySelector('.icon-filter2').innerHTML = ICONS.filter;
  document.querySelector('.icon-chevron2').innerHTML = ICONS.chevronDown;

  const CHANNEL_ICONS = {
    whatsapp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
    sms: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    email: ICONS.mail,
  };
  function CHANNEL_LABELS() { return { whatsapp: I18N.t('notifications_page.channel_whatsapp'), sms: I18N.t('notifications_page.channel_sms'), email: I18N.t('notifications_page.channel_email') }; }
  function KIND_LABELS() { return { confirmation: I18N.t('notifications_page.kind_confirmation'), reminder: I18N.t('notifications_page.kind_reminder'), rescheduled: I18N.t('notifications_page.kind_rescheduled'), cancelled: I18N.t('notifications_page.kind_cancelled') }; }
  const STATE_BADGE = { scheduled: 'neutral', sent: 'info', delivered: 'success', failed: 'danger' };

  let allMessages = [];
  let allNotifications = [];
  let channelFilter = 'all';
  let stateFilter = 'all';
  let kindFilter = 'all';

  function buildFilterMenus() {
    document.getElementById('stateFilterMenu').innerHTML = ['all', 'scheduled', 'sent', 'delivered', 'failed'].map(s => `
      <button class="dropdown-item" data-state="${s}">${s === 'all' ? I18N.t('notifications_page.all_states') : I18N.t('status.' + s)}</button>
    `).join('');
    document.getElementById('kindFilterMenu').innerHTML = ['all', 'confirmation', 'reminder', 'rescheduled', 'cancelled'].map(k => `
      <button class="dropdown-item" data-kind="${k}">${k === 'all' ? I18N.t('notifications_page.all_types') : KIND_LABELS()[k]}</button>
    `).join('');
  }

  function renderMessages() {
    const filtered = allMessages.filter(m => {
      if (channelFilter !== 'all' && m.channel !== channelFilter) return false;
      if (stateFilter !== 'all' && m.state !== stateFilter) return false;
      if (kindFilter !== 'all' && m.kind !== kindFilter) return false;
      return true;
    });

    const list = document.getElementById('msgList');
    const emptyState = document.getElementById('emptyState');

    if (filtered.length === 0) {
      list.classList.add('hidden');
      emptyState.classList.remove('hidden');
      emptyState.innerHTML = `<div class="empty-state"><div class="empty-state__icon">${icon('inbox')}</div><div class="empty-state__title">${I18N.t('common.no_results')}</div></div>`;
      return;
    }
    list.classList.remove('hidden');
    emptyState.classList.add('hidden');

    list.innerHTML = filtered.map(m => `
      <div class="msg-row" data-id="${m.id}">
        <div class="channel-icon ${m.channel}">${CHANNEL_ICONS[m.channel]}</div>
        <div class="msg-row__body">
          <div class="msg-row__title">${m.patientName} · ${KIND_LABELS()[m.kind]}</div>
          <div class="msg-row__meta">${m.appointment}</div>
        </div>
        <span class="badge badge-${STATE_BADGE[m.state]}">${I18N.t('status.' + m.state)}</span>
      </div>
    `).join('');

    list.querySelectorAll('.msg-row').forEach(row => row.addEventListener('click', () => openMsgDetail(row.dataset.id)));
  }

  let currentMsg = null;
  function openMsgDetail(id) {
    const m = allMessages.find(x => x.id === id);
    if (!m) return;
    currentMsg = m;

    document.getElementById('msgDetailHeader').innerHTML = `
      <div class="channel-icon ${m.channel}" style="width:44px;height:44px;">${CHANNEL_ICONS[m.channel]}</div>
      <div>
        <div class="fw-semibold">${m.patientName}</div>
        <div class="text-sm text-muted">${CHANNEL_LABELS()[m.channel]} · ${KIND_LABELS()[m.kind]}</div>
      </div>
    `;
    document.getElementById('msgDetailMeta').innerHTML = `
      <div class="info-row flex items-center justify-between text-sm" style="padding:6px 0; border-bottom:1px solid var(--color-border);"><span class="text-muted">${I18N.t('notifications_page.appointment')}</span><span class="fw-medium">${m.appointment}</span></div>
      <div class="info-row flex items-center justify-between text-sm" style="padding:6px 0; border-bottom:1px solid var(--color-border);"><span class="text-muted">${I18N.t('notifications_page.sent_at')}</span><span class="fw-medium">${m.sentAt}</span></div>
      <div class="info-row flex items-center justify-between text-sm" style="padding:6px 0;"><span class="text-muted">${I18N.t('notifications_page.status')}</span><span class="badge badge-${STATE_BADGE[m.state]}">${I18N.t('status.' + m.state)}</span></div>
    `;
    document.getElementById('msgDetailContent').textContent = m.content;
    document.getElementById('resendMsgBtn').classList.toggle('hidden', m.state !== 'failed');

    Modal.open('msgDetailModal');
  }

  document.getElementById('resendMsgBtn').addEventListener('click', () => {
    if (currentMsg) { currentMsg.state = 'sent'; renderMessages(); }
    Modal.close('msgDetailModal');
    Toast.success(I18N.t('notifications_page.message_resent_title'), I18N.t('notifications_page.message_resent_desc'));
  });

  document.querySelector('.tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-channel]');
    if (!btn) return;
    document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    channelFilter = btn.getAttribute('data-channel');
    renderMessages();
  });

  document.getElementById('stateFilterMenu').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-state]');
    if (!btn) return;
    stateFilter = btn.getAttribute('data-state');
    document.getElementById('stateFilterLabel').textContent = stateFilter === 'all' ? I18N.t('notifications_page.state') : I18N.t('status.' + stateFilter);
    renderMessages();
  });

  document.getElementById('kindFilterMenu').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-kind]');
    if (!btn) return;
    kindFilter = btn.getAttribute('data-kind');
    document.getElementById('kindFilterLabel').textContent = kindFilter === 'all' ? I18N.t('notifications_page.type') : KIND_LABELS()[kindFilter];
    renderMessages();
  });

  function renderStats() {
    const total = allMessages.length;
    const delivered = allMessages.filter(m => m.state === 'delivered').length;
    const failed = allMessages.filter(m => m.state === 'failed').length;
    const scheduled = allMessages.filter(m => m.state === 'scheduled').length;

    const stats = [
      { label: I18N.t('notifications_page.total_sent'), value: total, icon: 'bell', color: 'blue' },
      { label: I18N.t('notifications_page.delivered'), value: delivered, icon: 'checkCircle', color: 'green' },
      { label: I18N.t('notifications_page.scheduled'), value: scheduled, icon: 'clock', color: 'amber' },
      { label: I18N.t('notifications_page.failed'), value: failed, icon: 'alertTriangle', color: 'red' },
    ];
    document.getElementById('statsGrid').innerHTML = stats.map(s => `
      <div class="stat-card">
        <div class="stat-card__info">
          <div class="stat-card__label">${s.label}</div>
          <div class="stat-card__value">${s.value}</div>
        </div>
        <div class="stat-card__icon ${s.color}">${icon(s.icon)}</div>
      </div>
    `).join('');
  }

  function timeAgo(mins) {
    if (mins < 60) return I18N.t('common.minutes_ago').replace('{n}', mins);
    return I18N.t('common.hours_ago').replace('{n}', Math.floor(mins / 60));
  }

  const NOTIF_ICON_MAP = { appointment: 'calendarCheck', payment: 'dollar', cancel: 'close', reminder: 'bell', system: 'alertTriangle' };
  const NOTIF_COLOR_MAP = { appointment: 'blue', payment: 'green', cancel: 'red', reminder: 'amber', system: 'red' };

  function renderInApp() {
    document.getElementById('notifList').innerHTML = allNotifications.map(n => `
      <div class="flex items-start gap-3" style="padding: var(--space-3) 0; border-bottom: 1px solid var(--color-border);">
        <div class="stat-card__icon ${NOTIF_COLOR_MAP[n.type]}" style="width:38px;height:38px;flex-shrink:0;">
          <span style="width:18px;height:18px; display:inline-flex;">${ICONS[NOTIF_ICON_MAP[n.type]]}</span>
        </div>
        <div class="flex-1" style="min-width:0;">
          <div class="text-sm fw-semibold">${n.title}</div>
          <div class="text-sm text-muted">${n.desc}</div>
          <div class="text-xs text-muted mt-1">${timeAgo(n.time)}</div>
        </div>
        ${!n.read ? '<span style="width:8px; height:8px; border-radius:50%; background:var(--color-primary); flex-shrink:0; margin-top:6px;"></span>' : ''}
      </div>
    `).join('');
  }

  document.getElementById('markAllReadBtn').addEventListener('click', () => {
    allNotifications.forEach(n => n.read = true);
    renderInApp();
    Toast.success(I18N.t('toast.saved_title'));
  });

  Promise.all([MOCK_API.getMessageLog(clinicId), MOCK_API.getNotifications(clinicId)]).then(([messages, notifications]) => {
    allMessages = messages;
    allNotifications = notifications;
    buildFilterMenus();
    renderStats();
    renderMessages();
    renderInApp();
  });

  document.addEventListener('i18n:changed', () => { buildFilterMenus(); renderStats(); renderMessages(); renderInApp(); });
</script>
</body>
</html>
