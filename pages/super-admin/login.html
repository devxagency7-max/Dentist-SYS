<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/reset.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--color-primary) 0%, #2C5AA0 55%, var(--color-secondary) 100%);
    padding: var(--space-6);
  }
  .sa-card {
    width: 100%;
    max-width: 400px;
    background: var(--color-surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: var(--space-8);
  }
  .sa-badge {
    display: inline-flex; align-items: center; gap: var(--space-2);
    background: var(--color-primary-light); color: var(--color-primary);
    font-size: var(--fs-xs); font-weight: var(--fw-semibold);
    padding: 4px var(--space-3); border-radius: var(--radius-full);
    margin-bottom: var(--space-4);
  }
  .sa-card h1 { font-size: var(--fs-xl); margin-bottom: var(--space-1); }
  .sa-card > p { color: var(--color-text-muted); font-size: var(--fs-sm); margin-bottom: var(--space-6); }
</style>
</head>
<body>

<div class="sa-card">
  <div class="sa-badge">Super Admin</div>
  <h1>System owner console</h1>
  <p>Sign in to create and manage doctor accounts.</p>

  <form id="saLoginForm">
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" id="saEmail" placeholder="you@yourcompany.com" required>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="saPassword" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn btn-primary btn-lg w-full" id="saLoginBtn">Sign In</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="../../js/firebase-init.js"></script>
<script src="../../js/components.js"></script>
<script>
  document.getElementById('saLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('saEmail').value.trim();
    const password = document.getElementById('saPassword').value;
    const btn = document.getElementById('saLoginBtn');
    btn.disabled = true;

    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      const tokenResult = await cred.user.getIdTokenResult(true);
      if (tokenResult.claims.superAdmin !== true) {
        await auth.signOut();
        throw new Error('This account is not authorized as a super admin.');
      }
      window.location.href = 'dashboard.html';
    } catch (err) {
      btn.disabled = false;
      Toast.error('Sign-in failed', err.message || 'Email or password is incorrect.');
    }
  });
</script>
</body>
</html>
