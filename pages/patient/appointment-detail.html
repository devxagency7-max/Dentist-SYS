<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Details — DentalCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/reset.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/layout.css">
<style>
  .notif-row { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) 0; border-bottom: 1px solid var(--color-border); }
  .notif-row:last-child { border-bottom: none; }
  .notif-row__label { display: flex; align-items: center; gap: var(--space-3); }
  .notif-row__label .icon-wrap { width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--color-surface-alt); display: flex; align-items: center; justify-content: center; }
  .notif-row__label .icon-wrap svg { width: 18px; height: 18px; }
  .notif-sent { display: flex; align-items: center; gap: 6px; color: var(--color-success); font-weight: var(--fw-semibold); font-size: var(--fs-sm); }
  .notif-sent svg { width: 16px; height: 16px; }
  .notif-none { color: var(--color-text-muted); font-size: var(--fs-sm); }
</style>
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<template id="tpl-page">
  <div class="page-header">
    <div>
      <a href="appointments.html" class="text-sm text-muted link" style="display:inline-flex; align-items:center; gap:4px; margin-bottom: var(--space-2);">${'{{CHEVRON_LEFT}}'}<span data-i18n="patient_portal.my_appointments">My Appointments</span></a>
      <h1 class="page-header__title" data-i18n="patient_portal.appointment_details">Appointment Details</h1>
    </div>
  </div>

  <div id="notFoundState" class="hidden"></div>

  <div id="detailArea" class="grid-2">
    <div class="flex flex-col gap-6">
      <div class="card">
        <div class="card-header">
          <div class="card-title" data-i18n="patient_portal.appointment_info">Appointment Information</div>
          <span id="apptStatusBadge"></span>
        </div>
        <div class="flex flex-col" id="apptInfoRows"></div>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title" data-i18n="patient_portal.clinic_info">Clinic Information</div></div>
        <div class="flex flex-col" id="clinicInfoRows"></div>
      </div>
    </div>

    <div class="flex flex-col gap-6">
      <div class="card">
        <div class="card-header"><div class="card-title" data-i18n="patient_portal.notification_status">Notification Status</div></div>
        <div id="notifRows"></div>
      </div>

      <div class="card" id="actionsCard">
        <div class="flex flex-col gap-2">
          <button class="btn btn-secondary w-full" id="detailRescheduleBtn" data-i18n="patient_portal.reschedule_appointment">Reschedule Appointment</button>
          <button class="btn btn-danger w-full" id="detailCancelBtn" data-i18n="patient_portal.cancel_appointment">Cancel Appointment</button>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- Cancel confirm modal -->
<div class="modal-backdrop" id="cancelApptModal">
  <div class="modal modal-sm">
    <div class="modal-body" style="text-align:center; padding-top: var(--space-8);">
      <div class="confirm-icon danger" style="margin-inline:auto;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div>
      <h3 data-i18n="patient_portal.cancel_confirm_title">Cancel this appointment?</h3>
      <p class="text-muted mt-2" data-i18n="patient_portal.cancel_confirm_desc">We'll let the clinic know right away. This cannot be undone.</p>
    </div>
    <div class="modal-footer" style="justify-content:center;">
      <button class="btn btn-secondary" data-modal-close data-i18n="patient_portal.keep_appointment">Keep Appointment</button>
      <button class="btn btn-danger" id="confirmCancelApptBtn" data-i18n="patient_portal.cancel_appointment">Cancel Appointment</button>
    </div>
  </div>
</div>

<!-- Reschedule modal -->
<div class="modal-backdrop" id="rescheduleApptModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title" data-i18n="patient_portal.reschedule_appointment">Reschedule Appointment</div>
      <button class="btn-icon btn-sm" data-modal-close><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label class="form-label" data-i18n="common.date">Date</label><input type="date" class="form-control" id="rescheduleDateInput"></div>
        <div class="form-group"><label class="form-label" data-i18n="common.time">Time</label><input type="time" class="form-control" id="rescheduleTimeInput"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-modal-close data-i18n="common.cancel">Cancel</button>
      <button class="btn btn-primary" id="confirmRescheduleApptBtn" data-i18n="common.confirm">Confirm</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="../../js/firebase-init.js"></script>
<script src="../../js/firestore-api.js"></script>
<script src="../../js/tenant.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/translations.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/theme.js"></script>
<script src="../../js/icons.js"></script>
<script src="../../js/components.js"></script>
<script src="../../js/app-shell.js"></script>
<script>
  THEME.init();
  I18N.init(TRANSLATIONS);
  AppShell.init({ active: 'appointments', role: 'patient' });

  const content = document.getElementById('pageContent');
  content.innerHTML = document.getElementById('tpl-page').innerHTML.replace("${'{{CHEVRON_LEFT}}'}", ICONS.chevronLeft);
  I18N.applyToDOM(content);

  const apptId = new URLSearchParams(location.search).get('id');

  function statusBadge(status) {
    const map = { confirmed: 'info', pending: 'warning', completed: 'success', cancelled: 'danger', waiting: 'warning', in_progress: 'info', no_show: 'neutral' };
    return `<span class="badge badge-${map[status] || 'neutral'}">${I18N.t('status.' + status)}</span>`;
  }

  function infoRow(iconName, label, value) {
    return `
      <div class="notif-row">
        <span class="notif-row__label">
          <span class="icon-wrap">${icon(iconName)}</span>
          <span class="text-sm text-muted">${label}</span>
        </span>
        <span class="fw-semibold">${value || '—'}</span>
      </div>
    `;
  }

  async function render() {
    const appointments = await API.getAppointments();
    const appt = appointments.find(a => a.id === apptId);

    if (!appt) {
      document.getElementById('detailArea').classList.add('hidden');
      const nf = document.getElementById('notFoundState');
      nf.classList.remove('hidden');
      nf.innerHTML = `<div class="empty-state"><div class="empty-state__icon">${icon('appointments')}</div><div class="empty-state__title">Appointment not found</div><a href="appointments.html" class="btn btn-primary">Back to My Appointments</a></div>`;
      return;
    }

    document.getElementById('apptStatusBadge').innerHTML = statusBadge(appt.status);

    document.getElementById('apptInfoRows').innerHTML = [
      infoRow('user', I18N.t('common.doctor'), appt.doctor || 'Doctor'),
      infoRow('treatments', I18N.t('common.treatment'), appt.treatment || 'Consultation'),
      infoRow('calendar', I18N.t('common.date'), appt.date || '—'),
      infoRow('clock', I18N.t('common.time'), `${appt.time || '—'} (${appt.duration || 30} min)`),
    ].join('');

    const clinic = (appt.clinicId ? await API.getClinicById(appt.clinicId) : null) || (await API.getClinics())[0] || {};
    document.getElementById('clinicInfoRows').innerHTML = [
      infoRow('idCard', 'Clinic', clinic.clinicName || 'Clinic'),
      infoRow('phone', I18N.t('common.phone'), clinic.phone || '—'),
      infoRow('mail', I18N.t('common.email'), clinic.email || clinic.contactEmail || '—'),
      infoRow('mapPin', 'Address', clinic.address || '—'),
    ].join('');

    const messages = await API.getMessageLog();
    const related = messages.filter(m => m.appointment && appt.treatment && m.appointment.startsWith(appt.treatment));
    const channels = [
      { key: 'whatsapp', icon: 'whatsapp', label: 'WhatsApp' },
      { key: 'sms', icon: 'sms', label: 'SMS' },
      { key: 'email', icon: 'mail', label: 'Email' },
    ];
    document.getElementById('notifRows').innerHTML = channels.map(c => {
      const msg = related.find(m => m.channel === c.key);
      const sentState = msg && ['sent', 'delivered'].includes(msg.state);
      return `
        <div class="notif-row">
          <span class="notif-row__label">
            <span class="icon-wrap">${icon(c.icon)}</span>
            <span class="fw-medium">${c.label}</span>
          </span>
          ${sentState
            ? `<span class="notif-sent">${icon('check')}<span data-i18n="patient_portal.sent_via"></span></span>`
            : `<span class="notif-none">—</span>`}
        </div>
      `;
    }).join('');
    I18N.applyToDOM(document.getElementById('notifRows'));

    const actionsCard = document.getElementById('actionsCard');
    const canModify = ['confirmed', 'pending'].includes(appt.status);
    actionsCard.classList.toggle('hidden', !canModify);

    if (canModify) {
      document.getElementById('detailRescheduleBtn').onclick = () => {
        document.getElementById('rescheduleDateInput').value = appt.date || '';
        document.getElementById('rescheduleTimeInput').value = appt.time || '';
        Modal.open('rescheduleApptModal');
      };
      document.getElementById('detailCancelBtn').onclick = () => Modal.open('cancelApptModal');
      document.getElementById('confirmCancelApptBtn').onclick = async () => {
        await API.updateAppointment(apptId, { status: 'cancelled' });
        Modal.close('cancelApptModal');
        await render();
        Toast.success(I18N.t('toast.saved_title'), 'Your appointment has been cancelled.');
      };
      document.getElementById('confirmRescheduleApptBtn').onclick = async () => {
        const newDate = document.getElementById('rescheduleDateInput').value;
        const newTime = document.getElementById('rescheduleTimeInput').value;
        if (newDate && newTime) {
          await API.updateAppointment(apptId, { date: newDate, time: newTime });
        }
        Modal.close('rescheduleApptModal');
        await render();
        Toast.success('Appointment rescheduled', 'You will receive a confirmation shortly.');
      };
    }
  }

  render();
  document.addEventListener('i18n:changed', render);
</script>
</body>
</html>
