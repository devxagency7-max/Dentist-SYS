<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — DentalCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/reset.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/layout.css">
<style>
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    background: var(--color-border);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .cal-day-name {
    background: var(--color-surface-alt);
    text-align: center;
    padding: var(--space-2);
    font-size: var(--fs-xs);
    font-weight: var(--fw-semibold);
    color: var(--color-text-muted);
    text-transform: uppercase;
  }
  .cal-cell {
    background: var(--color-surface);
    min-height: 110px;
    padding: var(--space-2);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cal-cell.other-month { background: var(--color-bg); }
  .cal-cell.other-month .cal-date { color: var(--color-text-muted); opacity: 0.5; }
  .cal-cell.today { box-shadow: inset 0 0 0 2px var(--color-primary); }
  .cal-date { font-size: var(--fs-sm); font-weight: var(--fw-semibold); }
  .cal-cell.today .cal-date {
    background: var(--color-primary); color: #fff; width: 22px; height: 22px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: var(--fs-xs);
  }
  .cal-event {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 5px;
    background: var(--color-primary-light);
    color: var(--color-primary);
    font-weight: var(--fw-medium);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-event.warning { background: var(--color-warning-light); color: var(--color-warning); }
  .cal-event.success { background: var(--color-success-light); color: var(--color-success); }
  .cal-event { cursor: grab; }
  .cal-event.dragging { opacity: 0.4; }
  .cal-cell.drop-target { background: var(--color-primary-light); }
  @media (max-width: 768px) {
    .cal-cell { min-height: 70px; }
    .cal-day-name { font-size: 10px; }
  }

  /* Week / Day grid */
  .week-grid {
    display: grid;
    grid-template-columns: 64px repeat(var(--cols, 7), 1fr);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--color-surface);
  }
  .week-head { padding: var(--space-2); text-align: center; font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--color-text-muted); background: var(--color-surface-alt); border-inline-start: 1px solid var(--color-border); text-transform: uppercase; }
  .week-head.today-col { color: var(--color-primary); }
  .week-time-label { padding: 4px var(--space-2); font-size: 10px; color: var(--color-text-muted); text-align: end; border-top: 1px solid var(--color-border); }
  .week-slot { min-height: 48px; border-top: 1px solid var(--color-border); border-inline-start: 1px solid var(--color-border); position: relative; padding: 2px; }
  .week-slot.drop-target { background: var(--color-primary-light); }
  .week-event {
    font-size: 10.5px; padding: 3px 6px; border-radius: 5px; background: var(--color-primary-light); color: var(--color-primary);
    font-weight: var(--fw-medium); cursor: grab; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .week-event.warning { background: var(--color-warning-light); color: var(--color-warning); }
  .week-event.success { background: var(--color-success-light); color: var(--color-success); }
  .week-event.dragging { opacity: 0.4; }

  .reschedule-time-box { display:flex; align-items:center; justify-content:space-between; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--color-surface-alt); margin-bottom: var(--space-3); }
  .reschedule-arrow { display:flex; align-items:center; justify-content:center; margin: var(--space-2) 0; color: var(--color-text-muted); }
  .whatsapp-preview { display:flex; align-items:flex-start; gap: var(--space-3); background: #25D3660d; border: 1px solid #25D36633; border-radius: var(--radius-md); padding: var(--space-3); margin-top: var(--space-4); }
  .whatsapp-preview svg { width: 20px; height: 20px; color: #25D366; flex-shrink: 0; }
</style>
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<template id="tpl-page">
  <div class="page-header">
    <div>
      <h1 class="page-header__title" data-i18n="calendar.title">Calendar</h1>
      <p class="page-header__desc" data-i18n="calendar.desc">Visual overview of clinic schedule</p>
    </div>
    <div class="page-header__actions">
      <div class="tabs" style="border-bottom:none;" id="viewTabs">
        <button class="tab" data-view="day" data-i18n="calendar.day">Day</button>
        <button class="tab" data-view="week" data-i18n="calendar.week">Week</button>
        <button class="tab active" data-view="month" data-i18n="calendar.month">Month</button>
      </div>
      <button class="btn btn-primary" data-modal-open="bookingWizardModal"><span class="icon-plus"></span><span data-i18n="appointments.new_appointment">New Appointment</span></button>
    </div>
  </div>

  <div class="card">
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-2">
        <button class="btn-icon" id="prevBtn">${'{{CHEVRON_LEFT}}'}</button>
        <h3 id="periodLabel" style="min-width:180px; text-align:center;">September 2026</h3>
        <button class="btn-icon" id="nextBtn">${'{{CHEVRON_RIGHT}}'}</button>
      </div>
      <button class="btn btn-secondary btn-sm" id="todayBtn" data-i18n="common.today">Today</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="week-grid hidden" id="weekGrid" style="overflow-x:auto;"></div>
  </div>
</template>

<!-- Reschedule confirmation modal -->
<div class="modal-backdrop" id="rescheduleModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">Reschedule appointment?</div>
      <button class="btn-icon btn-sm" data-modal-close><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <p class="text-sm text-muted mb-4" id="reschedulePatientLine">Moving Sarah Johnson's appointment.</p>
      <div class="reschedule-time-box">
        <span class="text-sm text-muted">Old time</span>
        <span class="fw-semibold text-sm" id="oldTimeValue">Sep 2, 09:00</span>
      </div>
      <div class="reschedule-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></div>
      <div class="reschedule-time-box">
        <span class="text-sm text-muted">New time</span>
        <span class="fw-semibold text-sm" id="newTimeValue" style="color:var(--color-primary);">Sep 3, 09:00</span>
      </div>
      <div class="whatsapp-preview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <div class="text-sm">Patient will receive a WhatsApp notification.</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelRescheduleBtn" data-i18n="common.cancel">Cancel</button>
      <button class="btn btn-primary" id="confirmRescheduleBtn" data-i18n="common.confirm">Confirm</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="../../js/firebase-init.js"></script>
<script src="../../js/translations.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/theme.js"></script>
<script src="../../js/icons.js"></script>
<script src="../../js/firestore-api.js"></script>
<script src="../../js/tenant.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/components.js"></script>
<script src="../../js/booking-wizard.js"></script>
<script src="../../js/app-shell.js"></script>
<script>
  THEME.init();
  I18N.init(TRANSLATIONS);
  AppShell.init({ active: 'calendar', role: 'receptionist' });
  auth.onAuthStateChanged((user) => {
    if (!user) { window.location.href = '../public/login.html'; }
  });
  const clinicId = TENANT.getCurrentClinicId();

  const content = document.getElementById('pageContent');
  content.innerHTML = document.getElementById('tpl-page').innerHTML
    .replace("${'{{CHEVRON_LEFT}}'}", ICONS.chevronLeft)
    .replace("${'{{CHEVRON_RIGHT}}'}", ICONS.chevronRight);
  I18N.applyToDOM(content);
  document.querySelector('.icon-plus').innerHTML = ICONS.plus;

  function DAY_NAMES() { return I18N.t('calendar.days'); }
  function DAY_NAMES_SHORT() { return I18N.t('calendar.days_short'); }
  function MONTH_NAMES() { return I18N.t('calendar.months'); }
  let viewDate = new Date(2026, 8, 2);
  const TODAY = new Date(2026, 8, 2);
  let currentView = 'month';
  const HOURS = Array.from({ length: 11 }, (_, i) => 8 + i); // 08:00 - 18:00

  function toKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function statusClass(status) {
    if (status === 'confirmed') return '';
    if (status === 'completed') return 'success';
    return 'warning';
  }

  function startOfWeek(d) {
    const copy = new Date(d);
    copy.setDate(copy.getDate() - copy.getDay());
    return copy;
  }

  async function render() {
    if (currentView === 'month') { await renderMonth(); return; }
    if (currentView === 'week') { await renderWeek(startOfWeek(viewDate), 7); return; }
    await renderWeek(viewDate, 1);
  }

  let allAppointmentsCache = [];

  async function renderMonth() {
    document.getElementById('calGrid').classList.remove('hidden');
    document.getElementById('weekGrid').classList.add('hidden');

    const appointments = await MOCK_API.getAppointments(clinicId);
    allAppointmentsCache = appointments;
    const byDate = {};
    appointments.forEach(a => { (byDate[a.date] ||= []).push(a); });

    document.getElementById('periodLabel').textContent = `${MONTH_NAMES()[viewDate.getMonth()]} ${viewDate.getFullYear()}`;

    const grid = document.getElementById('calGrid');
    let html = DAY_NAMES().map(d => `<div class="cal-day-name">${d}</div>`).join('');

    const firstDay = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();
    const daysInPrevMonth = new Date(viewDate.getFullYear(), viewDate.getMonth(), 0).getDate();

    const cells = [];
    for (let i = startOffset - 1; i >= 0; i--) {
      cells.push({ day: daysInPrevMonth - i, otherMonth: true, date: new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, daysInPrevMonth - i) });
    }
    for (let d = 1; d <= daysInMonth; d++) {
      cells.push({ day: d, otherMonth: false, date: new Date(viewDate.getFullYear(), viewDate.getMonth(), d) });
    }
    let nextDay = 1;
    while (cells.length % 7 !== 0) {
      cells.push({ day: nextDay, otherMonth: true, date: new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, nextDay) });
      nextDay++;
    }

    cells.forEach(cell => {
      const key = toKey(cell.date);
      const isToday = key === toKey(TODAY);
      const events = byDate[key] || [];
      html += `
        <div class="cal-cell ${cell.otherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}" data-date="${key}">
          <span class="cal-date">${cell.day}</span>
          ${events.slice(0, 3).map(e => `<span class="cal-event ${statusClass(e.status)}" draggable="true" data-appt-id="${e.id}">${e.time} ${e.patientName.split(' ')[0]}</span>`).join('')}
          ${events.length > 3 ? `<span class="text-xs text-muted">+${events.length - 3} more</span>` : ''}
        </div>
      `;
    });

    grid.innerHTML = html;
    wireDragDrop(grid, '.cal-cell', '.cal-event');
  }

  async function renderWeek(anchorDate, days) {
    document.getElementById('calGrid').classList.add('hidden');
    const weekGrid = document.getElementById('weekGrid');
    weekGrid.classList.remove('hidden');
    weekGrid.style.setProperty('--cols', days);

    const appointments = await MOCK_API.getAppointments(clinicId);
    allAppointmentsCache = appointments;
    const dates = Array.from({ length: days }, (_, i) => {
      const d = new Date(anchorDate);
      d.setDate(d.getDate() + i);
      return d;
    });

    if (days === 1) {
      document.getElementById('periodLabel').textContent = `${DAY_NAMES()[dates[0].getDay()]}, ${MONTH_NAMES()[dates[0].getMonth()]} ${dates[0].getDate()}`;
    } else {
      document.getElementById('periodLabel').textContent = `${MONTH_NAMES()[dates[0].getMonth()]} ${dates[0].getDate()} – ${dates[6].getDate()}`;
    }

    const byDateHour = {};
    appointments.forEach(a => {
      const hour = parseInt(a.time.split(':')[0], 10);
      const bucket = `${a.date}_${hour}`;
      (byDateHour[bucket] ||= []).push(a);
    });

    let html = `<div class="week-head"></div>`;
    dates.forEach(d => {
      const isToday = toKey(d) === toKey(TODAY);
      html += `<div class="week-head ${isToday ? 'today-col' : ''}">${DAY_NAMES_SHORT()[d.getDay()]}<br>${d.getDate()}</div>`;
    });

    HOURS.forEach(hour => {
      html += `<div class="week-time-label">${String(hour).padStart(2, '0')}:00</div>`;
      dates.forEach(d => {
        const key = toKey(d);
        const bucket = `${key}_${hour}`;
        const events = byDateHour[bucket] || [];
        html += `<div class="week-slot" data-date="${key}" data-hour="${hour}">
          ${events.map(e => `<div class="week-event ${statusClass(e.status)}" draggable="true" data-appt-id="${e.id}">${e.time} ${e.patientName.split(' ')[0]}</div>`).join('')}
        </div>`;
      });
    });

    weekGrid.innerHTML = html;
    wireDragDrop(weekGrid, '.week-slot', '.week-event');
  }

  function wireDragDrop(container, slotSelector, eventSelector) {
    container.querySelectorAll(eventSelector).forEach(el => {
      el.addEventListener('dragstart', () => el.classList.add('dragging'));
      el.addEventListener('dragend', () => el.classList.remove('dragging'));
    });
    container.querySelectorAll(slotSelector).forEach(slot => {
      slot.addEventListener('dragover', (e) => { e.preventDefault(); slot.classList.add('drop-target'); });
      slot.addEventListener('dragleave', () => slot.classList.remove('drop-target'));
      slot.addEventListener('drop', (e) => {
        e.preventDefault();
        slot.classList.remove('drop-target');
        const dragging = container.querySelector(`${eventSelector}.dragging`);
        if (!dragging) return;
        const apptId = dragging.getAttribute('data-appt-id');
        const newDate = slot.getAttribute('data-date');
        const newHour = slot.getAttribute('data-hour');
        openReschedule(apptId, newDate, newHour);
      });
    });
  }

  let pendingReschedule = null;
  function openReschedule(apptId, newDate, newHour) {
    const appt = allAppointmentsCache.find(a => a.id === apptId);
    if (!appt) return;
    if (appt.date === newDate && (newHour === undefined || parseInt(appt.time.split(':')[0], 10) === parseInt(newHour, 10))) return;

    const newTime = newHour !== undefined ? `${String(newHour).padStart(2, '0')}:00` : appt.time;
    pendingReschedule = { appt, oldDate: appt.date, oldTime: appt.time, newDate, newTime };

    document.getElementById('reschedulePatientLine').textContent = `Moving ${appt.patientName}'s ${appt.treatment} appointment.`;
    document.getElementById('oldTimeValue').textContent = `${appt.date} at ${appt.time}`;
    document.getElementById('newTimeValue').textContent = `${newDate} at ${newTime}`;
    Modal.open('rescheduleModal');
  }

  document.getElementById('confirmRescheduleBtn').addEventListener('click', async () => {
    if (pendingReschedule) {
      const { appt, newDate, newTime } = pendingReschedule;
      await MOCK_API.updateAppointment(appt.id, { date: newDate, time: newTime });
      pendingReschedule = null;
      render();
      Toast.success('Appointment rescheduled', 'Patient will receive a WhatsApp notification.');
    }
    Modal.close('rescheduleModal');
  });
  document.getElementById('cancelRescheduleBtn').addEventListener('click', () => {
    pendingReschedule = null;
    render();
  });

  document.getElementById('viewTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-view]');
    if (!btn) return;
    document.querySelectorAll('#viewTabs .tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.getAttribute('data-view');
    render();
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentView === 'month') viewDate.setMonth(viewDate.getMonth() - 1);
    else if (currentView === 'week') viewDate.setDate(viewDate.getDate() - 7);
    else viewDate.setDate(viewDate.getDate() - 1);
    render();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentView === 'month') viewDate.setMonth(viewDate.getMonth() + 1);
    else if (currentView === 'week') viewDate.setDate(viewDate.getDate() + 7);
    else viewDate.setDate(viewDate.getDate() + 1);
    render();
  });
  document.getElementById('todayBtn').addEventListener('click', () => { viewDate = new Date(2026, 8, 2); render(); });

  render();
  BookingWizard.mount();
  document.addEventListener('booking:created', render);
  document.addEventListener('i18n:changed', render);
</script>
</body>
</html>
