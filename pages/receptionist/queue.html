<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Queue — DentalCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/reset.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/layout.css">
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<template id="tpl-page">
  <div class="page-header">
    <div>
      <h1 class="page-header__title" data-i18n="receptionist.queue_title">Live Queue</h1>
      <p class="page-header__desc" data-i18n="receptionist.queue_desc">Manage patients currently in the waiting room.</p>
    </div>
    <div class="page-header__actions">
      <button class="btn btn-primary" data-modal-open="checkinModal"><span class="icon-plus"></span><span data-i18n="receptionist.check_in">Check In</span></button>
    </div>
  </div>

  <div class="card" style="margin-bottom: var(--space-6);">
    <div class="card-header">
      <div class="card-title" data-i18n="receptionist.now_serving">Now Serving</div>
    </div>
    <div id="nowServingArea"></div>
  </div>

  <div class="flex items-center justify-between" style="margin-bottom: var(--space-4);">
    <h3 style="font-size: var(--fs-lg);" data-i18n="receptionist.waiting_patients_count">Waiting Patients</h3>
    <span class="badge badge-warning" id="waitingCountBadge"></span>
  </div>
  <div class="queue-card-grid" id="queueGrid"></div>
  <div id="emptyState" class="hidden"></div>
</template>

<!-- Check-in modal -->
<div class="modal-backdrop" id="checkinModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title" data-i18n="receptionist.check_in">Check In Patient</div>
      <button class="btn-icon btn-sm" data-modal-close><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Select Appointment</label>
        <select class="form-control" id="checkinSelect"></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-modal-close data-i18n="common.cancel">Cancel</button>
      <button class="btn btn-primary" id="confirmCheckinBtn" data-i18n="receptionist.check_in">Check In</button>
    </div>
  </div>
</div>

<!-- Queue action confirm modal -->
<div class="modal-backdrop" id="queueActionModal">
  <div class="modal modal-sm">
    <div class="modal-body" style="text-align:center; padding-top: var(--space-8);">
      <div class="confirm-icon danger" id="queueActionIcon" style="margin-inline:auto;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
      <h3 id="queueActionTitle">Mark as completed?</h3>
      <p class="text-muted mt-2" id="queueActionDesc">This will move the patient out of the waiting queue.</p>
    </div>
    <div class="modal-footer" style="justify-content:center;">
      <button class="btn btn-secondary" data-modal-close data-i18n="common.cancel">Cancel</button>
      <button class="btn btn-primary" id="queueActionConfirmBtn" data-i18n="common.confirm">Confirm</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="../../js/firebase-init.js"></script>
<script src="../../js/translations.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/theme.js"></script>
<script src="../../js/icons.js"></script>
<script src="../../js/firestore-api.js"></script>
<script src="../../js/tenant.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/components.js"></script>
<script src="../../js/booking-wizard.js"></script>
<script src="../../js/app-shell.js"></script>
<script>
  THEME.init();
  I18N.init(TRANSLATIONS);
  AppShell.init({ active: 'queue', role: 'receptionist' });
  auth.onAuthStateChanged((user) => {
    if (!user) { window.location.href = '../public/login.html'; }
  });
  const clinicId = TENANT.getCurrentClinicId();

  const TODAY = '2026-09-02';

  const content = document.getElementById('pageContent');
  content.innerHTML = document.getElementById('tpl-page').innerHTML;
  I18N.applyToDOM(content);
  document.querySelector('.icon-plus').innerHTML = ICONS.plus;

  function initials(name) { return name.split(' ').map(n => n[0]).join('').slice(0, 2); }

  let nowServing = null; // { patientId, patientName, service }
  let appointmentsCache = [];
  let queueCache = [];

  async function refreshAppointmentsCache() {
    appointmentsCache = await MOCK_API.getAppointments(clinicId);
    return appointmentsCache;
  }

  async function renderNowServing() {
    const el = document.getElementById('nowServingArea');
    if (!nowServing) {
      await refreshAppointmentsCache();
      const inProgress = appointmentsCache.find(a => a.date === TODAY && a.status === 'in_progress');
      if (inProgress) nowServing = { patientId: inProgress.patientId, patientName: inProgress.patientName, service: inProgress.treatment };
    }
    if (!nowServing) {
      el.innerHTML = `<div class="empty-state" style="padding: var(--space-6) var(--space-4);"><div class="empty-state__icon">${icon('userCheck')}</div><div class="empty-state__title" data-i18n="receptionist.no_one_serving">No one is currently being served</div></div>`;
      I18N.applyToDOM(el);
      return;
    }
    el.innerHTML = `
      <div class="now-serving-card">
        <div class="now-serving-card__avatar">${initials(nowServing.patientName)}</div>
        <div>
          <div class="now-serving-card__label" data-i18n="receptionist.now_serving">Now Serving</div>
          <div class="now-serving-card__name">${nowServing.patientName}</div>
          <div class="now-serving-card__meta">${nowServing.service}</div>
        </div>
        <div class="now-serving-card__actions">
          <button class="btn-icon tooltip" data-tooltip="${I18N.t('common.complete')}" id="completeServingBtn">${icon('checkCircle')}</button>
        </div>
      </div>
    `;
    I18N.applyToDOM(el);
    document.getElementById('completeServingBtn').addEventListener('click', async () => {
      const appt = appointmentsCache.find(a => a.patientId === nowServing.patientId && a.date === TODAY);
      if (appt) await MOCK_API.updateAppointment(appt.id, { status: 'completed' });
      Toast.success(I18N.t('toast.saved_title'), `${nowServing.patientName} marked as completed.`);
      nowServing = null;
      renderNowServing();
    });
  }

  let queueActionCallback = null;
  async function renderQueue() {
    const queue = await MOCK_API.getQueue(clinicId);
    queueCache = queue;
    document.getElementById('waitingCountBadge').textContent = I18N.t('common.waiting_count_badge').replace('{n}', queue.length);
    const grid = document.getElementById('queueGrid');
    const empty = document.getElementById('emptyState');

    if (queue.length === 0) {
      grid.classList.add('hidden');
      empty.classList.remove('hidden');
      empty.innerHTML = `<div class="empty-state"><div class="empty-state__icon">${icon('users')}</div><div class="empty-state__title" data-i18n="receptionist.queue_empty_title">Waiting room is empty</div><div class="empty-state__desc" data-i18n="receptionist.queue_empty_desc">Checked-in patients will appear here.</div></div>`;
      I18N.applyToDOM(empty);
      return;
    }

    grid.classList.remove('hidden');
    empty.classList.add('hidden');
    grid.innerHTML = queue.map(q => `
      <div class="queue-card">
        <div class="queue-card__position">#${q.position}</div>
        <div class="queue-card__header">
          <div class="avatar avatar-md" style="background:#${q.avatarColor}22; color:#${q.avatarColor};">${initials(q.patientName)}</div>
          <div>
            <div class="queue-card__name">${q.patientName}</div>
            <div class="queue-card__service">${q.service}</div>
          </div>
        </div>
        <div class="queue-card__wait"><span class="wait-dot"></span><span>${I18N.t('status.waiting')} · ${q.waitingSince} min</span></div>
        <div class="queue-card__actions">
          <button class="btn-icon tooltip queue-call-btn" data-id="${q.patientId}" data-tooltip="${I18N.t('common.call')}">${icon('phone')}</button>
          <button class="btn btn-primary btn-sm queue-start-btn" data-id="${q.patientId}" data-i18n="common.start">Start</button>
          <button class="btn-icon tooltip queue-complete-btn" data-id="${q.patientId}" data-tooltip="${I18N.t('common.complete')}">${icon('checkCircle')}</button>
          <button class="btn-icon tooltip queue-cancel-btn" data-id="${q.patientId}" data-tooltip="${I18N.t('receptionist.remove_from_queue')}">${icon('close')}</button>
        </div>
      </div>
    `).join('');
    I18N.applyToDOM(grid);

    grid.querySelectorAll('.queue-call-btn').forEach(btn => btn.addEventListener('click', () => {
      Toast.info('Calling patient', 'The patient has been notified to come to the front desk.');
    }));
    grid.querySelectorAll('.queue-start-btn').forEach(btn => btn.addEventListener('click', () => openQueueAction(btn.dataset.id, 'start')));
    grid.querySelectorAll('.queue-complete-btn').forEach(btn => btn.addEventListener('click', () => openQueueAction(btn.dataset.id, 'complete')));
    grid.querySelectorAll('.queue-cancel-btn').forEach(btn => btn.addEventListener('click', () => openQueueAction(btn.dataset.id, 'cancel')));
  }

  function openQueueAction(patientId, action) {
    const copy = {
      start: { title: 'Start appointment?', desc: 'This will move the patient into an in-progress appointment.' },
      complete: { title: 'Mark as completed?', desc: 'This will move the patient out of the waiting queue.' },
      cancel: { title: 'Remove from queue?', desc: 'The patient will be removed from today’s waiting room.' },
    }[action];
    document.getElementById('queueActionTitle').textContent = copy.title;
    document.getElementById('queueActionDesc').textContent = copy.desc;
    queueActionCallback = async () => {
      const q = queueCache.find(entry => entry.patientId === patientId);
      await refreshAppointmentsCache();
      const appt = appointmentsCache.find(a => a.patientId === patientId && a.date === TODAY);

      if (action === 'start' && q) {
        nowServing = { patientId: q.patientId, patientName: q.patientName, service: q.service };
        if (appt) await MOCK_API.updateAppointment(appt.id, { status: 'in_progress' });
        renderNowServing();
      }
      if (action === 'complete' && appt) {
        await MOCK_API.updateAppointment(appt.id, { status: 'completed' });
      }
      if (action === 'cancel' && appt) {
        await MOCK_API.updateAppointment(appt.id, { status: 'cancelled' });
      }
      if (q) await MOCK_API.removeQueueEntry(q.id);
      renderQueue();
      Toast.success(I18N.t('toast.saved_title'));
    };
    Modal.open('queueActionModal');
  }

  document.getElementById('queueActionConfirmBtn').addEventListener('click', () => {
    if (queueActionCallback) queueActionCallback();
    Modal.close('queueActionModal');
  });

  async function renderCheckinOptions() {
    const appointments = await MOCK_API.getAppointments(clinicId);
    const today = appointments.filter(a => a.date === TODAY && (a.status === 'confirmed' || a.status === 'pending'));
    document.getElementById('checkinSelect').innerHTML = today.map(a => `<option value="${a.id}">${a.time} — ${a.patientName}</option>`).join('');
  }

  document.getElementById('confirmCheckinBtn').addEventListener('click', async () => {
    const id = document.getElementById('checkinSelect').value;
    await refreshAppointmentsCache();
    const appt = appointmentsCache.find(a => a.id === id);
    if (appt) {
      await MOCK_API.updateAppointment(appt.id, { status: 'waiting' });
      const nextPos = queueCache.length ? Math.max(...queueCache.map(q => q.position)) + 1 : 1;
      await MOCK_API.addQueueEntry({
        clinicId, position: nextPos, patientId: appt.patientId, patientName: appt.patientName,
        avatarColor: appt.avatarColor, service: appt.treatment, waitingSince: 0, status: 'waiting',
      });
    }
    Modal.close('checkinModal');
    renderQueue();
    renderCheckinOptions();
    Toast.success('Patient checked in', 'The patient has been added to the waiting room.');
  });

  function renderAll() { renderNowServing(); renderQueue(); renderCheckinOptions(); }
  renderAll();
  BookingWizard.mount();
  document.addEventListener('i18n:changed', renderAll);
</script>
</body>
</html>
